[package]
name = "coins"
version = "0.3.0"
edition = "2024"
# The minimum this builds on, checked by CI rather than assumed.
rust-version = "1.86"
description = "Cryptocurrency prices, charts and holdings in your terminal"
license = "MIT"
repository = "https://github.com/msimkin/coins"
keywords = ["cryptocurrency", "cli", "terminal", "chart", "portfolio"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
toml = "1.1"
toml_edit = "0.25"
ureq = { version = "3.4", features = ["json"] }

[profile.release]
strip = true
